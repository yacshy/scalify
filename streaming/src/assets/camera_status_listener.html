<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>摄像头状态监听 · 外接 USB 摄像头</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f1115;
    color: #e6e8ea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #181b22;
    border: 1px solid #2a2f3a;
    border-radius: 16px;
    padding: 40px 48px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: #9aa3b2;
    margin-bottom: 8px;
    letter-spacing: .02em;
  }
  .model {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 32px;
    color: #f0f2f5;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    border-radius: 12px;
    margin-bottom: 16px;
    transition: background .25s ease, border-color .25s ease;
    border: 1px solid transparent;
  }
  .status-row.online {
    background: rgba(34, 197, 94, .08);
    border-color: rgba(34, 197, 94, .3);
  }
  .status-row.offline {
    background: rgba(239, 68, 68, .08);
    border-color: rgba(239, 68, 68, .3);
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 4px currentColor;
  }
  .online .dot  { background: #22c55e; color: rgba(34, 197, 94, .15); animation: pulse 2s infinite; }
  .offline .dot { background: #ef4444; color: rgba(239, 68, 68, .15); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px currentColor; }
    50%      { box-shadow: 0 0 0 8px transparent; }
  }
  .label { font-size: 14px; color: #9aa3b2; }
  .value { font-size: 18px; font-weight: 600; }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #6b7280;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #2a2f3a;
  }
  .meta span { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
  <div class="card">
    <h1>目标摄像头</h1>
    <div class="model">外接 USB 摄像头</div>

    <div class="status-row" id="cameraRow">
      <div class="dot"></div>
      <div>
        <div class="label">连接状态</div>
        <div class="value" id="cameraStatus">检测中…</div>
      </div>
    </div>

    <div class="status-row" id="wsRow">
      <div class="dot"></div>
      <div>
        <div class="label">WebSocket</div>
        <div class="value" id="wsStatus">连接中…</div>
      </div>
    </div>

    <div class="meta">
      <span id="lastUpdate">—</span>
      <span id="msgCount">0 条消息</span>
    </div>
  </div>

<script>
(function () {
  const cameraRow = document.getElementById('cameraRow');
  const cameraStatus = document.getElementById('cameraStatus');
  const wsRow = document.getElementById('wsRow');
  const wsStatus = document.getElementById('wsStatus');
  const lastUpdate = document.getElementById('lastUpdate');
  const msgCount = document.getElementById('msgCount');

  let count = 0;
  let reconnectDelay = 1000;

  function setCamera(alive) {
    cameraRow.classList.toggle('online', alive);
    cameraRow.classList.toggle('offline', !alive);
    cameraStatus.textContent = alive ? '在线 · 已检测' : '离线 · 未检测到';
    cameraStatus.style.color = alive ? '#22c55e' : '#ef4444';
  }

  function setWs(open) {
    wsRow.classList.toggle('online', open);
    wsRow.classList.toggle('offline', !open);
    wsStatus.textContent = open ? '已连接' : '已断开';
    wsStatus.style.color = open ? '#22c55e' : '#ef4444';
  }

  function connect() {
    // 兼容 http → ws, https → wss
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      setWs(true);
      reconnectDelay = 1000; // 重置退避
    };

    ws.onmessage = (ev) => {
      count++;
      msgCount.textContent = `${count} 条消息`;
      // 服务器只发 "1" 或 "0"
      setCamera(ev.data === '1');
      const now = new Date();
      lastUpdate.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
    };

    ws.onclose = () => {
      setWs(false);
      setCamera(false); // 断线时清空摄像头状态，避免误导
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };

    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }

  connect();
})();
</script>
</body>
</html>
