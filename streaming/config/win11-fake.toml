# ============================================================================
# win11-fake.toml — Win11 开发/自测配置（SCALP_PROFILE=win11-fake）
#
# 目的：在 Win11 上只跑通「控制面」7 个端点与 feedback/JSONL/状态机，
# 不实际执行任何 Linux 专有能力（v4l2 / hostapd / GStreamer / /dev/video*）。
# videotestsrc 假源只体现在「生成的 pipeline 描述字符串」里用于人工核对，
# 不会 spawn 任何进程（pipeline.spawn_processes = false + FakeBackend）。
# ============================================================================

profile = "win11-fake"

[server]
# Win11 fake 模式改绑回环（docs/API.md §0 例外条款；任务书端点表要求）。
bind_addr = "127.0.0.1:9090"

[capture]
# Win11 无 /dev/video*，device 用占位符；videotestsrc 假源由 profile 决定。
device = "fake-videotestsrc"
format = "MJPG"
width = 1280
height = 720
fps = 30

[encoder]
# 假源用软编字符串做命令核对（不实际执行）。属性名差异在 pipeline.rs 处理：
# vah264enc=b-frames=0 / x264enc=bframes=0 / v4l2h264enc=video_b_frames=0。
name = "x264enc"
bitrate_kbps = 2500

[rtsp]
url = "rtsp://127.0.0.1:8554/scalp"
protocols = "tcp"

[mediamtx]
control_api_base = "http://127.0.0.1:9997"
# Win11 未起 mediamtx Control API：关闭真实探流（api_enabled=false 时
# mediamtx.rs 直接返回 Skipped，看门狗也不做掉线迁移，避免假告警）。
api_enabled = false
probe_timeout_ms = 2000
probe_interval_ms = 5000

[network]
ap_subnet = "10.42.0.0/24"
ap_channel = 0
default_gateway_advertised = false
internet_forwarded = false
mediamtx_version = "v1.21.3"

[security]
wpa2_passphrase = ""

[logging]
jsonl_path = "logs/scalp-win11-fake.jsonl"

[pipeline]
# 硬约束：Win11 上绝不执行 GStreamer / v4l2 / hostapd。
spawn_processes = false

[watchdog]
auto_restart = false
failure_threshold = 3
